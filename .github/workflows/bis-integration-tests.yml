name: BIS isolated regression checks
on:
  push:
    branches:
      - bis-prod-sync-integration-2026-10-25
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bis-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependency
        run: python -m pip install -r requirements.txt
      - name: Syntax check of changed Python modules
        run: |
          python -m py_compile clean_caisse/app.py clean_caisse/manual_discount.py clean_caisse/offline_mode_phase6.py clean_caisse/history_modifier.py clean_caisse/receipt_photo_layout.py
      - name: Isolated BIS structural non-regression tests
        run: python -m unittest discover -s tests -p 'test_bis_integration_guard.py' -v
      - name: Module registration checks
        run: python -m unittest discover -s tests -p 'test_bis_module_registration.py' -v
      - name: Deliveroo remake sandbox safety guards
        run: python -m unittest discover -s tests -p 'test_bis_deliveroo_remake.py' -v
      - name: JavaScript POS and offline discount smoke tests
        run: python -m unittest discover -s tests -p 'test_bis_js_smoke.py' -v
      - name: POS save and pending-edit regression tests
        run: |
          python -m unittest discover -s tests -p 'test_pos_save_workflow.py' -v
          python -m unittest discover -s tests -p 'test_pos_pending_edit.py' -v
      - name: Delivery, table, and receipt regression tests
        if: success() || failure()
        run: |
          python -m unittest discover -s tests -p 'test_customer_delivery_roundtrip.py' -v
          python -m unittest discover -s tests -p 'test_delivery_details.py' -v
          python -m unittest discover -s tests -p 'test_table_occupancy.py' -v
          python -m unittest discover -s tests -p 'test_receipt_layout.py' -v
          python -m unittest discover -s tests -p 'test_religious_hours.py' -v
      - name: Discount end-to-end regression tests
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_manual_discount.py' -v
      - name: Pure discount calculations
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_discount_rules.py' -v

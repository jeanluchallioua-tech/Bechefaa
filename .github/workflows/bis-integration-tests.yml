name: BIS isolated regression checks
on:
  push:
    branches:
      - bis-prod-sync-integration-2026-10-25
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bis-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bechefaa_bis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bechefaa_bis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependency
        run: python -m pip install -r requirements.txt
      - name: Syntax check of changed Python modules
        run: |
          python -m py_compile clean_caisse/app.py clean_caisse/manual_discount.py clean_caisse/offline_mode_phase6.py clean_caisse/history_modifier.py clean_caisse/receipt_photo_layout.py
      - name: Isolated BIS structural non-regression tests
        run: python -m unittest discover -s tests -p 'test_bis_integration_guard.py' -v
      - name: Module registration checks
        run: python -m unittest discover -s tests -p 'test_bis_module_registration.py' -v
      - name: Deliveroo remake sandbox safety guards
        run: python -m unittest discover -s tests -p 'test_bis_deliveroo_remake.py' -v
      - name: Deliveroo sandbox mapping and idempotency regression tests
        if: success() || failure()
        run: |
          python -m unittest discover -s tests -p 'test_deliveroo_order_mapping.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_order_idempotency.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_order_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_kitchen_origin.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_kitchen_preview.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_plu_audit.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_explicit_plu_map.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_readiness.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_amount_audit.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_instruction_audit.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_menu_plu_contract.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_menu_identifier_collisions.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_menu_upload_guard.py' -v
      - name: Deliveroo remake runtime behavior tests
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_deliveroo_remake_runtime.py' -v
      - name: Deliveroo GUID immutable event replay checks
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_deliveroo_event_replay.py' -v
      - name: Deliveroo bridge runtime replay and strict input checks
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_deliveroo_bridge_runtime.py' -v
      - name: Deliveroo real PostgreSQL concurrent replay checks (isolated CI only)
        if: success() || failure()
        env:
          BECHEFAA_BIS_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/bechefaa_bis_ci
        run: python -m unittest tests.test_bis_deliveroo_bridge_runtime.PostgresDeliverooConcurrencyTests -v
      - name: JavaScript POS and offline discount smoke tests
        run: python -m unittest discover -s tests -p 'test_bis_js_smoke.py' -v
      - name: Rendered POS cart edit button and injection guards
        run: python -m unittest discover -s tests -p 'test_bis_pos_parity_render.py' -v
      - name: Classic kitchen send idempotency (no duplicate print pack)
        run: python -m unittest discover -s tests -p 'test_bis_classic_kitchen_idempotency.py' -v
      - name: POS save and pending-edit regression tests
        run: |
          python -m unittest discover -s tests -p 'test_pos_save_workflow.py' -v
          python -m unittest discover -s tests -p 'test_pos_pending_edit.py' -v
      - name: Delivery, table, and receipt regression tests
        if: success() || failure()
        run: |
          python -m unittest discover -s tests -p 'test_customer_delivery_roundtrip.py' -v
          python -m unittest discover -s tests -p 'test_delivery_details.py' -v
          python -m unittest discover -s tests -p 'test_table_occupancy.py' -v
          python -m unittest discover -s tests -p 'test_receipt_layout.py' -v
          python -m unittest discover -s tests -p 'test_religious_hours.py' -v
      - name: Discount end-to-end regression tests
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_manual_discount.py' -v
      - name: Pure discount calculations
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_discount_rules.py' -v

      - name: BIS marketplace pricing and non-destructive update tests
        if: success() || failure()
        run: python -m unittest discover -s tests -p 'test_bis_marketplace_markup.py' -v

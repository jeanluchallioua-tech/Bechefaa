name: Deliveroo production review (isolated database)
on:
  push:
    branches: [deliveroo-production-review-20261102]
    paths:
      - 'clean_caisse/deliveroo_production*.py'
      - 'clean_caisse/deliveroo_order_*'
      - 'clean_caisse/payment_transactions_phase44.py'
      - 'clean_caisse/app.py'
      - 'clean_caisse/table_core_phase36.py'
      - 'clean_caisse/epson_epos_network_phase6.py'
      - 'clean_caisse/printing_phase1.py'
      - 'tests/test_epson_navigation*'
      - 'tests/test_table_occupancy.py'
      - 'tests/test_table_release_postgres.py'
      - 'clean_caisse/order_notifications_phase33.py'
      - 'clean_caisse/kitchen_checklist.py'
      - 'clean_caisse/history_identity_phase44.py'
      - 'clean_caisse/site_order_hours_phase6.py'
      - 'clean_caisse/religious_calendar_phase6.py'
      - 'clean_caisse/static/deliveroo-notice-production.js'
      - 'tests/test_deliveroo_production*'
      - 'tests/test_deliveroo_auto_hours.py'
      - 'tests/test_deliveroo_hours_postgres.py'
      - '.github/workflows/deliveroo-production-review.yml'
      - 'tests/test_deliveroo_notice_production.js'
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: deliveroo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DELIVEROO_TEST_DATABASE_URL: postgresql://postgres:disposable-ci-only@127.0.0.1:5432/deliveroo_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Flask==3.1.2 'psycopg[binary]==3.2.10' Pillow==11.3.0
      - name: Unit contracts
        run: |
          python -m unittest discover -s tests -p 'test_deliveroo_production.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_auto_hours.py' -v
          python -m unittest discover -s tests -p 'test_table_occupancy.py' -v
          python -m unittest discover -s tests -p 'test_receipt_layout.py' -v
          python -m unittest discover -s tests -p 'test_epson_navigation.py' -v
      - name: Real PostgreSQL and HTTP contracts (synthetic orders only)
        run: |
          python -m unittest discover -s tests -p 'test_deliveroo_production_postgres.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_hours_postgres.py' -v
          python -m unittest discover -s tests -p 'test_deliveroo_production_menu.py' -v
          python -m unittest discover -s tests -p 'test_table_release_postgres.py' -v
      - name: JavaScript syntax
        run: |
          node --check clean_caisse/static/deliveroo-notice-production.js
          node tests/test_deliveroo_notice_production.js
          node tests/test_epson_navigation.js


